name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  frontend-tests:
    name: Frontend Tests (Jest)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run linter
        run: npm run lint || true
      
      - name: Run frontend tests
        run: npm test -- --passWithNoTests --coverage --watchAll=false
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

  python-backend-tests:
    name: Python Backend Tests (pytest)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short
      
      - name: Generate coverage report
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=. --cov-report=xml --cov-report=html || true
        continue-on-error: true

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-tests, python-backend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify all tests passed
        run: |
          echo "✅ All test suites completed successfully"
          echo "Frontend tests: ✅"
          echo "Python backend tests: ✅"
